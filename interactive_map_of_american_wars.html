<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map of American Wars</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

     crossorigin=""/>
     
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for antique parchment & modern legibility -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* Antique parchment thematic base styling */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f7f3e8;
            color: #2b231d;
        }
        h1, h2, h3, .heading-font {
            font-family: 'Cinzel', 'Playfair Display', serif;
        }
        #map {
            height: calc(100vh - 300px);
            min-height: 480px;
            width: 100%;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px -5px rgba(50, 30, 10, 0.25), 0 8px 10px -6px rgba(50, 30, 10, 0.2);
            border: 3px solid #7c3f1d;
        }
        .controls-container {
            background-color: rgba(247, 243, 232, 0.94);
            backdrop-filter: blur(8px);
            border: 2px solid #8b4513;
        }
        /* Custom timeline scroll and proportional layout */
        #battle-timeline-wrapper {
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: #a0522d #eddcc4;
        }
        #battle-timeline {
            position: relative;
            height: 76px;
            min-width: 720px;
            padding: 0 20px;
        }
        #battle-timeline::before {
            content: '';
            position: absolute;
            top: 42%;
            left: 15px;
            right: 15px;
            height: 4px;
            background: linear-gradient(90deg, #8b4513 0%, #b86729 50%, #8b4513 100%);
            transform: translateY(-50%);
            z-index: 1;
            border-radius: 2px;
        }
        .battle-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #3c1e0b;
            cursor: pointer;
            position: absolute;
            top: 42%;
            transform: translate(-50%, -50%);
            z-index: 3;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .battle-icon:hover {
            transform: translate(-50%, -50%) scale(1.4);
            z-index: 20;
        }
        .battle-icon.active {
            transform: translate(-50%, -50%) scale(1.65);
            box-shadow: 0 0 14px 4px #eab308;
            border-color: #000;
            z-index: 25;
        }
        .battle-icon .tooltip {
            visibility: hidden;
            width: 140px;
            background-color: #1e130c;
            color: #f7f3e8;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.25;
            text-align: center;
            border-radius: 6px;
            padding: 6px 8px;
            position: absolute;
            z-index: 30;
            bottom: 145%;
            left: 50%;
            margin-left: -70px;
            opacity: 0;
            transition: opacity 0.25s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.35);
            pointer-events: none;
            border: 1px solid #7c3f1d;
        }
        .battle-icon .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #1e130c transparent transparent transparent;
        }
        .battle-icon:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }
        .year-marker {
            position: absolute;
            top: 42%;
            transform: translate(-50%, -50%);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }
        .year-marker-label {
            margin-top: 36px;
            font-size: 11px;
            color: #5c3519;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .war-tab {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.03em;
            margin-bottom: -2px;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
        }
        .war-tab:hover {
            border-color: #a0522d;
            color: #8b0000;
            background-color: rgba(139, 69, 19, 0.05);
        }
        .war-tab.active {
            color: #8B0000;
            border-color: #8B0000;
            font-weight: 700;
            background-color: rgba(139, 69, 19, 0.08);
        }
        /* Leaflet popup customization */
        .leaflet-popup-content-wrapper {
            background: #fdfaf2;
            color: #231b15;
            border-radius: 8px;
            border: 2px solid #8b4513;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            padding: 2px;
        }
        .leaflet-popup-tip {
            background: #8b4513;
        }
        .leaflet-popup-content h3 {
            font-family: 'Cinzel', 'Playfair Display', serif;
            margin: 0 0 4px 0;
            color: #8B0000;
            font-weight: 700;
            font-size: 1.1rem;
        }
        /* Custom markers styling */
        .hub-pin, .dep-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: transform 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .hub-pin:hover, .dep-pin:hover {
            transform: scale(1.3);
            z-index: 500 !important;
        }
    </style>
</head>
<body class="bg-[#f7f3e8] text-gray-800 p-3 md:p-6 min-h-screen">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-5">
            <h1 class="text-3xl md:text-5xl font-extrabold text-[#7a1212] tracking-wide drop-shadow-sm">
                Chronicles of American Warfare
            </h1>
            <p class="text-sm md:text-base text-[#5c3a21] mt-1 italic font-medium">

        <!-- War Switcher Navigation Tabs -->
        <nav id="war-tabs" class="mb-4 flex flex-wrap justify-center border-b-2 border-[#d3be9f] gap-1 md:gap-2" aria-label="War tabs">

        <!-- Command & Filter Panel -->

                        <span>▶</span> <span id="btn-text">Start Campaign</span>
                    </button>
                    <button id="reset-view-btn" title="Center map on theater" class="bg-[#e4d4b9] text-[#4a260f] border border-[#a66a38] px-3 py-2 rounded-lg hover:bg-[#d8c3a1] transition-colors text-xs md:text-sm font-medium">
                        Center Map
                    </button>
                </div>

                <!-- Layer Visibility Toggles -->
                <div class="flex flex-wrap items-center gap-2 bg-[#ebdcc4] p-1.5 rounded-lg border border-[#c29f77] text-xs md:text-sm">
                    <span class="font-bold text-[#5c3a21] px-1 uppercase tracking-wider text-[11px]">Layers:</span>
                    <label class="flex items-center gap-1.5 px-2 py-1 rounded bg-[#f7f3e8] border border-[#b8956e] cursor-pointer select-none">
                        <input type="checkbox" id="toggle-battles" checked class="accent-[#7a1212] cursor-pointer">
                        <span class="font-medium text-gray-800">⚔️ Battles</span>
                    </label>
                    <label class="flex items-center gap-1.5 px-2 py-1 rounded bg-[#f7f3e8] border border-[#b8956e] cursor-pointer select-none">
                        <input type="checkbox" id="toggle-deployments" checked class="accent-[#2563eb] cursor-pointer">
                        <span class="font-medium text-gray-800">⛺ Deployments</span>
                    </label>
                    <label class="flex items-center gap-1.5 px-2 py-1 rounded bg-[#f7f3e8] border border-[#b8956e] cursor-pointer select-none">
                        <input type="checkbox" id="toggle-routes" checked class="accent-[#ca8a04] cursor-pointer">
                        <span class="font-medium text-gray-800">🛤️ Logistics Arteries</span>
                    </label>
                </div>

                <!-- Dynamic Dynamic Conflict Legend -->
                <div id="legend" class="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs md:text-sm">
                    <!-- Legend rendered dynamically -->
                </div>
            </div>

            <!-- Proportional Interactive Timeline -->
            <div id="battle-timeline-wrapper">
                <div id="battle-timeline"></div>
            </div>
        </div>

        <!-- Interactive Leaflet Map Container -->
        <div id="map"></div>

        <!-- Informative Footer -->
        <footer class="mt-4 text-center text-xs text-[#70523b] flex flex-wrap justify-between items-center px-2">
            <span>Historical Cartography Engine &bull; Click any marker, deployment, or logistics corridor for tactical dispatches.</span>
            <span id="conflict-status" class="font-semibold text-[#8b0000]">Select an engagement to begin.</span>
        </footer>
    </div>

                    { id: "ar1", name: "Lexington & Concord", date: "1775-04-19", location: [42.4475, -71.2335], state: "MA", outcome: "sideA", description: "The 'shot heard 'round the world.' British regular columns marching to seize colonial powder stockpiles at Concord were routed by gathering colonial Minutemen and forced into a bloody running retreat to Boston under heavy skirmishing fire.", wiki: "Battles_of_Lexington_and_Concord" },
                    { id: "ar_ticonderoga", name: "Capture of Fort Ticonderoga", date: "1775-05-10", location: [43.8419, -73.3876], state: "NY", outcome: "sideA", description: "Ethan Allen, the Green Mountain Boys, and Benedict Arnold seized the Lake Champlain fortress without a casualty. The captured heavy British artillery would later be hauled across winter terrain by Henry Knox to liberate Boston.", wiki: "Capture_of_Fort_Ticonderoga" },
                    { id: "ar2", name: "Battle of Bunker Hill", date: "1775-06-17", location: [42.3765, -71.0607], state: "MA", outcome: "sideB", description: "Fought primarily on Breed's Hill during the Siege of Boston. Though the British drove off the colonists after three desperate uphill charges, they lost over 1,000 dead and wounded, shattering the myth that colonial militia could not contest professional European infantry.", wiki: "Battle_of_Bunker_Hill" },
                    { id: "ar_quebec", name: "Battle of Quebec", date: "1775-12-31", location: [46.8139, -71.2080], state: "QC", outcome: "sideB", description: "A daring American joint assault during a blinding blizzard ended in catastrophe. General Richard Montgomery was killed, Benedict Arnold was severely wounded, and the Continental invasion of Canada was decisively turned back.", wiki: "Battle_of_Quebec_(1775)" },
                    { id: "ar_moores", name: "Battle of Moore's Creek Bridge", date: "1776-02-27", location: [34.5772, -78.1130], state: "NC", outcome: "sideA", description: "Patriot militia ambushed and broke a charging army of Scottish Highland Loyalists, ending Royal Governor Martin's plans to retake North Carolina and deterring British naval invasion forces under Clinton for years.", wiki: "Battle_of_Moore%27s_Creek_Bridge" },
                    { id: "ar_sullivan", name: "Battle of Sullivan's Island", date: "1776-06-28", location: [32.7635, -79.8601], state: "SC", outcome: "sideA", description: "A British naval armada under Sir Peter Parker pounded the palmetto-log fort guarding Charleston harbor. The spongy logs absorbed cannonballs, and American gunners inflicted punishing counter-battery fire, saving Charleston from early capture.", wiki: "Battle_of_Sullivan%27s_Island" },
                    { id: "ar3", name: "Battle of Long Island", date: "1776-08-27", location: [40.6782, -73.9442], state: "NY", outcome: "sideB", description: "The largest battle of the entire war. British General Howe outflanked Washington's lines via Jamaica Pass, crushing the Americans. Washington famously staged a nighttime phantom evacuation across the East River through dense fog, preserving the army.", wiki: "Battle_of_Long_Island" },
                    { id: "ar_whiteplains", name: "Battle of White Plains", date: "1776-10-28", location: [41.0339, -73.7629], state: "NY", outcome: "sideB", description: "Howe drove Washington's rearguard off Chatterton Hill, compelling the Continental Army to abandon Manhattan Island and begin their desperate November retreat across the snowy plains of New Jersey.", wiki: "Battle_of_White_Plains" },
                    { id: "ar4", name: "Battle of Trenton", date: "1776-12-26", location: [40.2206, -74.7597], state: "NJ", outcome: "sideA", description: "Washington led the Continental Army across the ice-choked Delaware River on Christmas night, surprising and capturing nearly 1,000 Hessian mercenaries at Trenton in a masterstroke that saved the American cause from collapse.", wiki: "Battle_of_Trenton" },
                    { id: "ar5", name: "Battle of Princeton", date: "1777-01-03", location: [40.3487, -74.6591], state: "NJ", outcome: "sideA", description: "Leaving his campfires burning to deceive Cornwallis at Trenton, Washington marched through the night to attack and rout three British regiments at Princeton, regaining control of nearly all of New Jersey.", wiki: "Battle_of_Princeton" },
                    { id: "ar_oriskany", name: "Battle of Oriskany & Fort Stanwix", date: "1777-08-06", location: [43.1764, -75.3644], state: "NY", outcome: "sideA", description: "One of the bloodiest clashes of the war, fought entirely between Americans and Loyalists alongside Allied Iroquois nations. The fierce resistance forced British General St. Leger to abandon his siege of Fort Stanwix, crippling Burgoyne's invasion plan.", wiki: "Battle_of_Oriskany" },
                    { id: "ar_bennington", name: "Battle of Bennington", date: "1777-08-16", location: [42.8942, -73.2987], state: "NY", outcome: "sideA", description: "John Stark's New Hampshire militia utterly annihilated a German and Loyalist foraging expedition sent by Burgoyne, depriving the British northern army of vital horses, draught animals, and rations.", wiki: "Battle_of_Bennington" },
                    { id: "ar7", name: "Battle of Brandywine", date: "1777-09-11", location: [39.8668, -75.6083], state: "PA", outcome: "sideB", description: "General Howe again outmaneuvered Washington by sending Cornwallis on a sweeping 17-mile flanking march around the American right flank, driving the Americans back and clearing the path for the British occupation of Philadelphia.", wiki: "Battle_of_Brandywine" },
                    { id: "ar_germantown", name: "Battle of Germantown", date: "1777-10-04", location: [40.0382, -75.1764], state: "PA", outcome: "sideB", description: "Washington's complex four-column dawn counterattack unraveled amid heavy morning fog and intense resistance at the stone Chew House. Despite the tactical defeat, European observers were impressed that the Continental Army could strike so boldly after Brandywine.", wiki: "Battle_of_Germantown" },

                    { id: "ar9", name: "Siege of Charleston", date: "1780-05-12", location: [32.7765, -79.9311], state: "SC", outcome: "sideB", description: "The greatest American catastrophe of the war. Encircled by British land and naval forces under Clinton and Cornwallis, General Benjamin Lincoln surrendered over 5,000 Continental soldiers and immense stockpiles of powder and artillery.", wiki: "Siege_of_Charleston" },
                    { id: "ar10", name: "Battle of Camden", date: "1780-08-16", location: [34.3614, -80.6173], state: "SC", outcome: "sideB", description: "Cornwallis decimated an American army under Horatio Gates. When Gates deployed green Virginia militia against seasoned British bayonets, the militia broke instantly, leading to an army-wide rout and Gates's public humiliation.", wiki: "Battle_of_Camden" },
                    { id: "ar_kingsmountain", name: "Battle of Kings Mountain", date: "1780-10-07", location: [35.1396, -81.3934], state: "SC", outcome: "sideA", description: "Frontier Patriot 'Overmountain Men' surrounded, assaulted, and wiped out Major Patrick Ferguson's elite Loyalist brigade on a steep rocky ridge, completely breaking Cornwallis's left wing and reversing the momentum in the Southern theater.", wiki: "Battle_of_Kings_Mountain" },

                    { id: "w1812_mackinac", name: "Siege of Fort Mackinac", date: "1812-07-17", location: [45.8578, -84.6178], state: "MI", outcome: "sideB", description: "Before American defenders even knew war had been declared, British soldiers and native allies brought guns to the high bluff, capturing the critical northern fur trading bastion without bloodshed.", wiki: "Siege_of_Fort_Mackinac" },
                    { id: "w1812_detroit", name: "Siege of Detroit", date: "1812-08-16", location: [42.3314, -83.0458], state: "MI", outcome: "sideB", description: "Paralyzed by fear of native scalping parties, elderly American General William Hull surrendered Fort Detroit, 2,500 troops, and 30 brass artillery pieces to British Major-General Isaac Brock and Tecumseh.", wiki: "Siege_of_Detroit" },
                    { id: "w1812_queenston", name: "Battle of Queenston Heights", date: "1812-10-13", location: [43.1611, -79.0558], state: "ON", outcome: "sideB", description: "The first major US offensive into Upper Canada failed disastrously when New York state militia refused to cross the Canadian border to relieve hard-pressed troops. General Isaac Brock was killed leading a charge.", wiki: "Battle_of_Queenston_Heights" },
                    { id: "w1812_riverraisin", name: "Battle of Frenchtown (River Raisin)", date: "1813-01-22", location: [41.9161, -83.3977], state: "MI", outcome: "sideB", description: "A British and Native surprise dawn assault destroyed a US Kentucky brigade. The following massacre of wounded prisoners became the rallying cry of western recruits: 'Remember the River Raisin!'", wiki: "Battle_of_Frenchtown" },
                    { id: "w1812_york", name: "Battle of York (Toronto)", date: "1813-04-27", location: [43.6387, -79.4053], state: "ON", outcome: "sideA", description: "US amphibious forces led by Zebulon Pike stormed Upper Canada's capital. When the British garrison detonated their powder magazine in retreat, Pike was killed, and vengeful US troops burned Parliament buildings.", wiki: "Battle_of_York" },
                    { id: "1812_1", name: "Battle of Lake Erie", date: "1813-09-10", location: [41.7656, -82.8094], state: "OH", outcome: "sideA", description: "Oliver Hazard Perry famously switched flagships rowboat-in-hand under heavy fire, capturing the entire British squadron: 'We have met the enemy and they are ours.' US control of Lake Erie forced the British to abandon Detroit.", wiki: "Battle_of_Lake_Erie" },
                    { id: "1812_2", name: "Battle of the Thames", date: "1813-10-05", location: [42.5950, -81.8900], state: "ON", outcome: "sideA", description: "William Henry Harrison's mounted Kentucky infantry charged and shattered the Anglo-Indian army. Great Shawnee leader Tecumseh was slain, destroying his tribal confederacy and ending British influence in the Old Northwest.", wiki: "Battle_of_the_Thames" },
                    { id: "w1812_crysler", name: "Battle of Crysler's Farm", date: "1813-11-11", location: [44.9753, -75.1058], state: "ON", outcome: "sideB", description: "A small British and Canadian regular force of 900 men stood in open plow-fields and repulsed 4,000 invading Americans, humiliating General James Wilkinson and saving Montreal from capture.", wiki: "Battle_of_Crysler%27s_Farm" },
                    { id: "w1812_chippawa", name: "Battle of Chippawa", date: "1814-07-05", location: [43.0600, -79.0500], state: "ON", outcome: "sideA", description: "Winfield Scott's thoroughly drilled grey-jacketed US regulars outfought British veteran lines in stand-up volleys. British commander Riall famously cried: 'Those are regulars, by God!'", wiki: "Battle_of_Chippawa" },
                    { id: "w1812_lundyslane", name: "Battle of Lundy's Lane", date: "1814-07-25", location: [43.0894, -79.0911], state: "ON", outcome: "draw", description: "The bloodiest battle fought on Canadian soil, fought in pitch darkness within earshot of Niagara Falls. Both armies fought to utter exhaustion and mutual retreat over captured artillery batteries.", wiki: "Battle_of_Lundy%27s_Lane" },
                    { id: "w1812_bladensburg", name: "Battle of Bladensburg & Burning of DC", date: "1814-08-24", location: [38.9392, -76.9339], state: "MD", outcome: "sideB", description: "A British expeditionary force routed uncoordinated Maryland militia in the 'Bladensburg Races,' marching into Washington D.C. that evening to burn the White House, Capitol, and Navy Yard.", wiki: "Battle_of_Bladensburg" },
                    { id: "1812_3", name: "Battle of Baltimore & Fort McHenry", date: "1814-09-13", location: [39.2628, -76.5797], state: "MD", outcome: "sideA", description: "A 25-hour naval bombardment of Fort McHenry failed to breach harbor defenses while US militia repelled British land forces at North Point. The morning sighting of the oversized garrison flag inspired the national anthem.", wiki: "Battle_of_Baltimore" },
                    { id: "w1812_plattsburgh", name: "Battle of Plattsburgh", date: "1814-09-11", location: [44.6995, -73.4528], state: "NY", outcome: "sideA", description: "Thomas Macdonough positioned his Lake Champlain fleet with anchor cables that let him wind his ships 180 degrees to bring fresh broadsides, destroying the British fleet and forcing 10,000 British regulars to retreat to Canada.", wiki: "Battle_of_Plattsburgh" },
                    { id: "1812_4", name: "Battle of New Orleans", date: "1815-01-08", location: [29.9406, -89.9928], state: "LA", outcome: "sideA", description: "Fought after the Treaty of Ghent was signed in Europe. Andrew Jackson's entrenched army of militia, frontiersmen, Choctaw, and Lafitte's pirates shattered Wellington's veteran British troops in under an hour, securing the Mississippi basin.", wiki: "Battle_of_New_Orleans" }
                ],

                    { id: "iw_greatswamp", name: "Great Swamp Fight", date: "1675-12-19", location: [41.4550, -71.5940], state: "RI", outcome: "sideA", description: "A bloody winter engagement during King Philip's War. Colonial militia crossed frozen bogs to breach the Narragansett palisade, resulting in devastating loss of life and food stores for the tribe.", wiki: "Great_Swamp_Fight" },
                    { id: "iw_bushyrun", name: "Battle of Bushy Run", date: "1763-08-05", location: [40.3542, -79.6267], state: "PA", outcome: "sideA", description: "During Pontiac's War, Colonel Henry Bouquet's Highland relief column was surrounded in the Pennsylvania woods. Bouquet feigned a center retreat to lure Native warriors into a devastating flank ambush, relieving besieged Fort Pitt.", wiki: "Battle_of_Bushy_Run" },
                    { id: "iw_pointpleasant", name: "Battle of Point Pleasant", date: "1774-10-10", location: [38.8419, -82.1408], state: "WV", outcome: "sideA", description: "Sole major action of Lord Dunmore's War. Virginia militia fought a day-long close-quarters battle against Shawnee forces under Cornstalk at the confluence of the Kanawha and Ohio rivers, opening Kentucky to colonial settlement.", wiki: "Battle_of_Point_Pleasant" },
                    { id: "iw_stclair", name: "St. Clair's Defeat", date: "1791-11-04", location: [40.5283, -84.7719], state: "OH", outcome: "sideB", description: "The greatest military disaster suffered by the US Army against Native forces. A confederacy led by Little Turtle and Blue Jacket surprised General St. Clair's camp, killing over 600 soldiers and wounding hundreds—nearly a quarter of the entire US Army.", wiki: "St._Clair%27s_defeat" },
                    { id: "iw1", name: "Battle of Fallen Timbers", date: "1794-08-20", location: [41.4883, -83.7058], state: "OH", outcome: "sideA", description: "Anthony Wayne's meticulously trained Legion of the United States bayonet-charged through a tornado-strewn forest to defeat the Western Confederacy. The victory led to the Treaty of Greenville, opening Ohio to settlement.", wiki: "Battle_of_Fallen_Timbers" },
                    { id: "iw2", name: "Battle of Tippecanoe", date: "1811-11-07", location: [40.5058, -86.9039], state: "IN", outcome: "sideA", description: "Governor William Henry Harrison fended off a dawn assault by Tecumseh's brother (the Prophet) outside Prophetstown. Harrison burned the spiritual capital, propelling Tecumseh into a full military alliance with Great Britain.", wiki: "Battle_of_Tippecanoe" },
                    { id: "iw_horseshoe", name: "Battle of Horseshoe Bend", date: "1814-03-27", location: [32.9772, -85.7314], state: "AL", outcome: "sideA", description: "Andrew Jackson and Cherokee allies assaulted the log breastwork of the Red Stick Creek faction on the Tallapoosa River. Over 800 Red Sticks were killed, ending the Creek War and forcing the surrender of 23 million acres of homeland.", wiki: "Battle_of_Horseshoe_Bend_(1814)" },
                    { id: "iw_dade", name: "Dade Massacre", date: "1835-12-28", location: [28.6653, -82.1286], state: "FL", outcome: "sideB", description: "Seminole warriors ambushed a column of 110 US troops under Major Francis Dade in the pine woods, killing all but three and igniting the bloody, seven-year Second Seminole War in the Everglades.", wiki: "Dade_battle" },
                    { id: "iw_sandcreek", name: "Sand Creek Massacre", date: "1864-11-29", location: [38.5492, -102.5089], state: "CO", outcome: "sideA", description: "Colorado volunteer cavalry under John Chivington attacked a peaceful Cheyenne and Arapaho encampment flying the American flag, murdering and mutilating over 150 women, children, and elderly people.", wiki: "Sand_Creek_massacre" },
                    { id: "iw_fetterman", name: "Fetterman Fight", date: "1866-12-21", location: [44.5739, -106.8408], state: "WY", outcome: "sideB", description: "During Red Cloud's War, Lakota warrior Crazy Horse lured Captain William Fetterman and 80 soldiers into a ravine ambush along the Bozeman Trail; all 81 US soldiers were killed within 20 minutes.", wiki: "Fetterman_Fight" },
                    { id: "iw3", name: "Battle of the Little Bighorn", date: "1876-06-25", location: [45.5647, -107.4283], state: "MT", outcome: "sideB", description: "Custer's 7th Cavalry divided forces and charged an immense Lakota, Northern Cheyenne, and Arapaho encampment. Crazy Horse, Gall, and Sitting Bull's warriors encircled and wiped out Custer and five companies on Last Stand Hill.", wiki: "Battle_of_the_Little_Bighorn" },
                    { id: "iw_bearpaw", name: "Battle of Bear Paw", date: "1877-10-05", location: [48.6186, -109.2894], state: "MT", outcome: "sideA", description: "Following an epic 1,170-mile fighting retreat across four states, Chief Joseph and the Nez Perce were besieged just 40 miles from the Canadian border, prompting his famous surrender speech: 'I will fight no more forever.'", wiki: "Battle_of_Bear_Paw" },
                    { id: "iw4", name: "Wounded Knee Massacre", date: "1890-12-29", location: [43.1414, -102.3644], state: "SD", outcome: "sideA", description: "US 7th Cavalry troops surrounded a Lakota encampment of Ghost Dancers to disarm them. A struggle triggered rapid-fire Hotchkiss revolving cannons, killing nearly 300 Lakota men, women, and children.", wiki: "Wounded_Knee_Massacre" }
                ],

                    { id: "maw1", name: "Battle of Palo Alto", date: "1846-05-08", location: [26.0189, -97.4789], state: "TX", outcome: "sideA", description: "The first major pitched battle. Zachary Taylor's revolutionary 'flying artillery'—rapidly maneuvered horse-drawn bronze cannons—inflicted devastating grape and canister fire on Mexican infantry.", wiki: "Battle_of_Palo_Alto" },
                    { id: "maw_resaca", name: "Battle of Resaca de la Palma", date: "1846-05-09", location: [25.9656, -97.4981], state: "TX", outcome: "sideA", description: "Fought in dense thorny chaparral outside Brownsville. A spirited US dragoon charge overran Mexican artillery positions, causing Arista's army to rout back across the swollen Rio Grande.", wiki: "Battle_of_Resaca_de_la_Palma" },
                    { id: "maw2", name: "Battle of Monterrey", date: "1846-09-24", location: [25.6866, -100.3161], state: "MX", outcome: "sideA", description: "Ferocious urban house-to-house fighting. Texas Rangers and US infantry used pickaxes to burrow through interior adobe walls while hauling howitzers to rooftops to capture Mexico's northern citadel.", wiki: "Battle_of_Monterrey" },
                    { id: "maw3", name: "Battle of Buena Vista", date: "1847-02-23", location: [25.3508, -101.0503], state: "MX", outcome: "sideA", description: "Taylor's 4,700 outnumbered volunteers faced 15,000 veteran Mexican soldiers under Santa Anna. Accurate artillery commanded by Braxton Bragg and a counterattack by Jefferson Davis's Mississippi Rifles won a narrow, bloody victory.", wiki: "Battle_of_Buena_Vista" },
                    { id: "maw_veracruz", name: "Siege of Veracruz", date: "1847-03-29", location: [19.1738, -96.1342], state: "MX", outcome: "sideA", description: "The first large-scale amphibious landing in US military history. General Winfield Scott landed 12,000 troops on surfboats without losing a man, heavily bombarding the port city into surrender.", wiki: "Siege_of_Veracruz" },
                    { id: "maw_cerrogordo", name: "Battle of Cerro Gordo", date: "1847-04-18", location: [19.4589, -96.7083], state: "MX", outcome: "sideA", description: "Captain Robert E. Lee reconnoitered a hidden path through steep mountain ravines around Santa Anna's fortified mountain pass, allowing Scott to flank and shatter the Mexican army.", wiki: "Battle_of_Cerro_Gordo" },
                    { id: "maw_churubusco", name: "Battle of Contreras & Churubusco", date: "1847-08-20", location: [19.3550, -99.1481], state: "MX", outcome: "sideA", description: "Scott stormed fortified lava fields outside Mexico City. At the Convent of Churubusco, Irish-American defectors in the Saint Patrick's Battalion fought bravely to the last cartridge.", wiki: "Battle_of_Churubusco" },
                    { id: "maw4", name: "Battle of Chapultepec", date: "1847-09-13", location: [19.4204, -99.1819], state: "MX", outcome: "sideA", description: "US Marines and regulars assaulted the 200-foot heights of Chapultepec Castle, the military academy of Mexico. Teenage cadets ('Los Niños Héroes') died defending the flag as Scott opened the city gates.", wiki: "Battle_of_Chapultepec" }

                battles: [
                    { id: "cw1", name: "Battle of Fort Sumter", date: "1861-04-12", location: [32.7523, -79.8747], state: "SC", outcome: "sideB", description: "Confederate batteries under P.G.T. Beauregard opened a 34-hour bombardment on the federal masonry fort in Charleston Harbor, igniting four years of civil war.", wiki: "Battle_of_Fort_Sumter" },
                    { id: "cw2", name: "First Battle of Bull Run (Manassas)", date: "1861-07-21", location: [38.8143, -77.5222], state: "VA", outcome: "sideB", description: "Untrained Union and Confederate armies clashed near Manassas junction. Thomas J. Jackson earned his 'Stonewall' moniker, and a Confederate flank charge panicked Union troops into a chaotic retreat to Washington.", wiki: "First_Battle_of_Bull_Run" },
                    { id: "cw_donelson", name: "Battle of Fort Donelson", date: "1862-02-16", location: [36.4856, -87.8583], state: "TN", outcome: "sideA", description: "Ulysses S. Grant demanded 'unconditional and immediate surrender,' capturing 12,000 Confederates and opening the Cumberland and Tennessee rivers to Union invasion.", wiki: "Battle_of_Fort_Donelson" },
                    { id: "cw3", name: "Battle of Shiloh", date: "1862-04-06", location: [35.1508, -88.3228], state: "TN", outcome: "sideA", description: "Confederate General Albert Sidney Johnston launched a massive surprise assault near sunken roads ('The Hornet's Nest'). Grant held the river line overnight, counterattacked with reinforcements, and won the bloodiest battle in American history to that date.", wiki: "Battle_of_Shiloh" },
                    { id: "cw_sevendays", name: "Seven Days Battles", date: "1862-07-01", location: [37.3592, -77.3208], state: "VA", outcome: "sideB", description: "Robert E. Lee assumed command of the Army of Northern Virginia and launched aggressive counterstrokes that drove George McClellan's Army of the Potomac away from the gates of Richmond.", wiki: "Seven_Days_Battles" },
                    { id: "cw_secondbullrun", name: "Second Battle of Bull Run", date: "1862-08-30", location: [38.8181, -77.5217], state: "VA", outcome: "sideB", description: "Stonewall Jackson lured John Pope's Union army into attacking an unfinished railroad grade, allowing James Longstreet to deliver a crushing 28,000-man flank counterattack that routed the Union army.", wiki: "Second_Battle_of_Bull_Run" },
                    { id: "cw4", name: "Battle of Antietam (Sharpsburg)", date: "1862-09-17", location: [39.4735, -77.7402], state: "MD", outcome: "sideA", description: "The bloodiest single day in American history with 22,700 casualties. Savage fighting raged through Miller's Cornfield, the Sunken Road, and Burnside's Bridge. Lee retreated to Virginia, providing Lincoln the victory needed to issue the preliminary Emancipation Proclamation.", wiki: "Battle_of_Antietam" },
                    { id: "cw_fredericksburg", name: "Battle of Fredericksburg", date: "1863-12-13", location: [38.2972, -77.4681], state: "VA", outcome: "sideB", description: "Union General Ambrose Burnside launched wave after wave of suicidal frontal assaults across open ground against Confederate infantry entrenched behind a stone wall on Marye's Heights, suffering 12,600 casualties.", wiki: "Battle_of_Fredericksburg" },
                    { id: "cw_chancellorsville", name: "Battle of Chancellorsville", date: "1863-05-02", location: [38.3106, -77.6481], state: "VA", outcome: "sideB", description: "Lee's tactical masterpiece. Outnumbered two-to-one by 'Fighting Joe' Hooker, Lee daringly divided his army and sent Stonewall Jackson on a 12-mile flank march through the Wilderness, though Jackson was mortally wounded by friendly fire.", wiki: "Battle_of_Chancellorsville" },

            maxNativeZoom: 16,
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; National Geographic, DeLorme, NAVTEQ, USGS, NOAA'
        }).addTo(map);

        // 2. Physical Topography & Contours (No API key, no watermarks)
        const esriTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, USGS, NPS, NRCAN'
        });

        // 3. OpenStreetMap Humanitarian (HOT) - Official community-funded OSM (No API key, no watermarks)
        const osmHot = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            maxZoom: 19,
            subdomains: ['a', 'b'],
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, Tiles by <a href="https://www.hotosm.org/" target="_blank" rel="noopener">Humanitarian OpenStreetMap Team</a>'
        });

        // 4. High-resolution Satellite Imagery for battlefield inspection
        const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping'
        });

        // Layer switcher control for historical analysis without API keys
        L.control.layers({
            "📜 Vintage Atlas (NatGeo)": esriNatGeo,
            "⛰️ Terrain & Topography (Esri)": esriTopo,
            "🗺️ OpenStreetMap (HOT)": osmHot,
            "🛰️ Satellite Imagery (Esri)": esriSatellite
        }, null, { position: 'topright' }).addTo(map);

        // Map visual layer groups
        const battleMarkersLayer = L.layerGroup().addTo(map);
        const deploymentsLayer = L.layerGroup().addTo(map);
        const routesLayer = L.layerGroup().addTo(map);

        // Control DOM references
        const timelineControlBtn = document.getElementById('timeline-control-btn');
        const btnText = document.getElementById('btn-text');
        const resetViewBtn = document.getElementById('reset-view-btn');
        const battleTimelineContainer = document.getElementById('battle-timeline');
        const warTabsContainer = document.getElementById('war-tabs');
        const legendContainer = document.getElementById('legend');
        const conflictStatus = document.getElementById('conflict-status');
        const toggleBattles = document.getElementById('toggle-battles');
        const toggleDeployments = document.getElementById('toggle-deployments');
        const toggleRoutes = document.getElementById('toggle-routes');

        // State trackers
        let currentWarKey = 'american-revolution';
        let currentBattleIndex = -1;
        let currentWarBattles = [];

        function populateTabs() {
            warTabsContainer.innerHTML = '';
            const warOrder = [
                "american-revolution", "war-of-1812", "indian-wars", 
                "mexican-american-war", "civil-war", "spanish-american-war", 
                "world-war-i", "world-war-ii"
            ];
            
            warOrder.forEach(key => {
                if (!allWarsData[key]) return;
                const tab = document.createElement('button');
                tab.className = 'war-tab px-3 py-1.5 md:px-4 md:py-2 text-xs md:text-sm font-semibold rounded-t-lg';
                tab.dataset.warKey = key;
                tab.innerHTML = `${allWarsData[key].name} <span class="hidden sm:inline text-[11px] opacity-75 font-normal">(${allWarsData[key].period})</span>`;
                tab.addEventListener('click', () => loadWar(key));
                warTabsContainer.appendChild(tab);
            });
        }

        // Stepping / selecting a specific battle in the sequence
        function goToBattle(index, panTo = true) {
            if (index < 0 || index >= currentWarBattles.length) return;

            currentBattleIndex = index;
            const battle = currentWarBattles[index];

            // Update timeline icons highlight
            document.querySelectorAll('.battle-icon').forEach((icon, idx) => {
                icon.classList.toggle('active', idx === index);
                if (idx === index) {
                    icon.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            });

            // Pan to marker and trigger rich popup
            const targetMarker = battleMarkersLayer.getLayers().find(layer => layer.options.battleId === battle.id);
            if (targetMarker) {
                if (panTo) {
                    map.flyTo(battle.location, Math.max(map.getZoom(), 7), {
                        animate: true,
                        duration: 0.9
                    });
                }
                setTimeout(() => targetMarker.openPopup(), 600);
            }

            // Update interactive UI text
            conflictStatus.innerHTML = `Battle ${index + 1} of ${currentWarBattles.length}: <strong class="text-[#8B0000]">${battle.name}</strong> (${battle.date})`;

            if (currentBattleIndex >= currentWarBattles.length - 1) {
                btnText.textContent = "Start Over";
            } else {
                btnText.textContent = `Next (${index + 2}/${currentWarBattles.length})`;
            }
        }

        function handleTimelineControl() {
            map.closePopup();
            let nextIndex = currentBattleIndex + 1;
            if (nextIndex >= currentWarBattles.length) {
                nextIndex = 0;
            }
            goToBattle(nextIndex, true);
        }

        function loadWar(warKey) {
            currentWarKey = warKey;
            currentBattleIndex = -1;
            
            // Clear current map layers and timeline
            battleMarkersLayer.clearLayers();
            deploymentsLayer.clearLayers();
            routesLayer.clearLayers();
            battleTimelineContainer.innerHTML = '';
            legendContainer.innerHTML = '';
            map.closePopup();

            // Set active tab styling
            document.querySelectorAll('.war-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.warKey === warKey);
            });

            const war = allWarsData[warKey];
            currentWarBattles = [...war.battles].sort((a, b) => new Date(a.date) - new Date(b.date));

            // Reset camera to the theater view
            map.setView(war.mapConfig.center, war.mapConfig.zoom);

            // Construct dynamic legend
            const legendItems = [
                { label: war.legend.sideA.name, color: war.legend.sideA.color },
                { label: war.legend.sideB.name, color: war.legend.sideB.color },
                { label: war.legend.draw ? war.legend.draw.name : "Draw / Neutral", color: war.legend.draw ? war.legend.draw.color : "#6b7280" },
                { label: "⛺ Deployment / HQ", color: "#4f46e5" },
                { label: "🛤️ Logistics Route", color: "#ca8a04", isLine: true }
            ];

            legendItems.forEach(item => {
                const el = document.createElement('div');
                el.className = 'flex items-center gap-1.5';
                if (item.isLine) {
                    el.innerHTML = `<span class="inline-block w-4 h-1 border-t-2 border-dashed" style="border-color:${item.color};"></span><span class="font-medium text-xs text-gray-700">${item.label}</span>`;
                } else {
                    el.innerHTML = `<span class="inline-block w-3.5 h-3.5 rounded-full border border-black/40" style="background-color:${item.color};"></span><span class="font-medium text-xs text-gray-700">${item.label}</span>`;
                }
                legendContainer.appendChild(el);
            });

            // 1. Render All Battles
            currentWarBattles.forEach(battle => {
                let markerColor = war.legend.draw ? war.legend.draw.color : '#6b7280';
                if (battle.outcome === 'sideA') markerColor = war.legend.sideA.color;
                if (battle.outcome === 'sideB') markerColor = war.legend.sideB.color;

                const formattedDate = new Date(battle.date.replace(/-/g, '/')).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });

                const wikiLink = battle.wiki 
                    ? `<a href="https://en.wikipedia.org/wiki/${battle.wiki}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-[#1d4ed8] hover:underline font-semibold text-xs mt-2">Historical Dispatch & Records &rarr;</a>` 
                    : '';

                const stateLabel = stateNames[battle.state] || battle.state;

                const popupHtml = `
                    <div class="p-1 max-w-[280px] sm:max-w-[320px]">
                        <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded text-white" style="background-color: ${markerColor}">
                            ${battle.outcome === 'sideA' ? war.legend.sideA.name : (battle.outcome === 'sideB' ? war.legend.sideB.name : 'Inconclusive / Siege')}
                        </span>
                        <h3 class="mt-1">${battle.name}</h3>
                        <p class="font-semibold text-xs text-[#7c3f1d] mb-1.5">${stateLabel} &bull; ${formattedDate}</p>
                        <p class="text-xs text-gray-800 leading-relaxed font-normal">${battle.description}</p>
                        ${wikiLink}
                    </div>
                `;

                L.circleMarker(battle.location, {
                    battleId: battle.id,
                    radius: 7,
                    fillColor: markerColor,
                    color: "#21150c",
                    weight: 1.5,
                    opacity: 1,
                    fillOpacity: 0.88
                }).bindPopup(popupHtml).addTo(battleMarkersLayer);
            });

            // 2. Render Deployments & Encampments
            if (war.deployments) {
                war.deployments.forEach(dep => {
                    const tentIcon = L.divIcon({
                        className: 'dep-custom-icon',
                        html: `<div class="dep-pin w-7 h-7 bg-[#4338ca] text-white text-sm rounded-full border-2 border-[#fdfaf2] flex items-center justify-center shadow-lg" title="${dep.name}">⛺</div>`,
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    });

                    const popupContent = `
                        <div class="p-1 max-w-[280px]">
                            <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-[#4338ca] text-white">Major Deployment & Headquarters</span>
                            <h3 class="mt-1 text-[#4338ca]">${dep.name}</h3>
                            <p class="font-semibold text-xs text-gray-600 mb-1">${dep.type}</p>
                            <p class="text-xs text-gray-800 leading-relaxed">${dep.desc}</p>
                        </div>
                    `;

                    L.marker(dep.location, { icon: tentIcon })
                        .bindPopup(popupContent)
                        .addTo(deploymentsLayer);
                });
            }

            // 3. Render Strategic Logistics Routes & Hubs
            if (war.routes) {
                war.routes.forEach(route => {
                    const polyline = L.polyline(route.coords, {
                        color: route.color || '#b45309',
                        weight: 4,
                        opacity: 0.85,
                        dashArray: route.dash || '6, 6'
                    }).addTo(routesLayer);

                    polyline.bindPopup(`
                        <div class="p-1 max-w-[280px]">
                            <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-[#b45309] text-white">Essential Logistics Artery</span>
                            <h3 class="mt-1 text-[#b45309]">${route.name}</h3>
                            <p class="text-xs text-gray-800 leading-relaxed mt-1">${route.desc}</p>
                        </div>
                    `);
                });
            }

            // 4. Construct Proportional Timeline
            if (currentWarBattles.length >= 2) {
                const firstDate = new Date(currentWarBattles[0].date);
                const lastDate = new Date(currentWarBattles[currentWarBattles.length - 1].date);
                const totalDuration = Math.max(lastDate.getTime() - firstDate.getTime(), 1);

                // Place battle icons along proportional line
                currentWarBattles.forEach((battle, idx) => {
                    const icon = document.createElement('div');
                    icon.className = 'battle-icon';

                    let markerColor = war.legend.draw ? war.legend.draw.color : '#6b7280';
                    if (battle.outcome === 'sideA') markerColor = war.legend.sideA.color;
                    if (battle.outcome === 'sideB') markerColor = war.legend.sideB.color;

                    icon.style.backgroundColor = markerColor;

                    const timeFromStart = new Date(battle.date).getTime() - firstDate.getTime();
                    const percent = Math.min(Math.max((timeFromStart / totalDuration) * 96 + 2, 2), 98);
                    icon.style.left = `${percent}%`;

                    const tip = document.createElement('span');
                    tip.className = 'tooltip';
                    tip.innerHTML = `<strong>${battle.name}</strong><br><span class="text-[#fde047] text-[10px]">${battle.date}</span>`;
                    icon.appendChild(tip);

                    icon.addEventListener('click', () => goToBattle(idx, true));
                    battleTimelineContainer.appendChild(icon);
                });

                // Generate smart spaced year labels
                const startYear = firstDate.getFullYear();
                const endYear = lastDate.getFullYear();
                const yearSpan = endYear - startYear;
                const interval = yearSpan > 10 ? Math.ceil(yearSpan / 10) : 1;

                let lastPlaced = -9999;
                for (let year = startYear; year <= endYear; year++) {
                    if ((year - startYear) % interval === 0) {
                        const targetTime = new Date(`${year}-01-01`).getTime() - firstDate.getTime();
                        let percent = (targetTime / totalDuration) * 96 + 2;
                        percent = Math.min(Math.max(percent, 2), 98);

                        const marker = document.createElement('div');
                        marker.className = 'year-marker';
                        marker.style.left = `${percent}%`;
                        marker.innerHTML = `<span class="year-marker-label">${year}</span>`;
                        battleTimelineContainer.appendChild(marker);
                        lastPlaced = year;
                    }
                }

                if (lastPlaced < endYear) {
                    const marker = document.createElement('div');
                    marker.className = 'year-marker';
                    marker.style.left = `98%`;
                    marker.innerHTML = `<span class="year-marker-label">${endYear}</span>`;
                    battleTimelineContainer.appendChild(marker);
                }
            }

            // Reset control states
            btnText.textContent = "Start Campaign";
            conflictStatus.innerHTML = `Loaded <strong>${war.name}</strong> (${war.period}) &mdash; ${currentWarBattles.length} engagements plotted.`;
        }

        timelineControlBtn.addEventListener('click', handleTimelineControl);

        resetViewBtn.addEventListener('click', () => {
            const war = allWarsData[currentWarKey];
            if (war) {
                map.flyTo(war.mapConfig.center, war.mapConfig.zoom, { animate: true, duration: 0.8 });
            }
        });

        // Layer toggles
        toggleBattles.addEventListener('change', (e) => {
            if (e.target.checked) map.addLayer(battleMarkersLayer);
            else map.removeLayer(battleMarkersLayer);
        });

        toggleDeployments.addEventListener('change', (e) => {
            if (e.target.checked) map.addLayer(deploymentsLayer);
            else map.removeLayer(deploymentsLayer);
        });

        toggleRoutes.addEventListener('change', (e) => {
            if (e.target.checked) map.addLayer(routesLayer);
            else map.removeLayer(routesLayer);
        });

        // Initialize application
        window.addEventListener('load', () => {
            populateTabs();
            loadWar('american-revolution');
        });
    </script>
</body>
</html>
